name: Assistant media

# Media work that needs Mariam's recorded voice (served from a CDN this repository's
# development container cannot reach): measuring the lines, trimming them and lip-syncing
# clips to them. A change to media/job.json runs it; the results are committed back to the
# branch (a push made with GITHUB_TOKEN does not start another workflow).
on:
  push:
    branches: [claude/affectionate-johnson-qoask3]
    paths: [media/job.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Run the job
        run: python scripts/media.py media/job.json
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A media/out public/assistant
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Assistant media: results of media/job.json"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
